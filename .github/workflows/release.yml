name: Release

# Publishes UrDatabase every time `main` gains a new version.
#
# The trigger is a plain push to `main` rather than a tag, because the version
# lives in `Directory.Build.props` and is reviewed as part of the pull request
# that changes the app. Tagging by hand afterwards is a second, silent step
# that gets forgotten, and when it is forgotten there is nothing to notice: the
# code is merged and simply never reaches anybody.
#
# The cost of that choice is that this workflow runs on every merge, including
# the many that change only docs, workflows or the downloads site. So the first
# thing it does is work out whether there is anything to release, and end
# quietly when there is not. It must succeed in that case: a red X on a merge
# that was never going to publish anything is how a pipeline gets ignored.
on:
  push:
    branches: [main]
  # Available by hand for the case where a release was deleted, or where the
  # tag was pushed but the publish failed halfway. Re-running against a version
  # whose tag already exists is a no-op, so this is safe to press.
  workflow_dispatch:

# `contents: write` to push the tag and create the release; `deployments: write`
# to record the deployment. Nothing wider: this token can reach the whole
# repository and there is no reason for it to be able to do more than the two
# things below.
permissions:
  contents: write
  deployments: write

# Two merges landing close together would otherwise race to tag, and the loser
# would fail on a tag the winner had just pushed. Not cancel-in-progress: a run
# that has already created a tag and started uploading assets must be allowed
# to finish, or the release is left half-published with a tag pointing at it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  release:
    name: Publish release
    # macOS for the same reason the pull request's build job uses it: the .NET
    # SDK ad-hoc signs the macOS launcher only on a macOS host, and an unsigned
    # arm64 binary is killed by the kernel on every Apple silicon Mac. Getting
    # this wrong would publish a permanently broken flagship download.
    #
    # The whole release runs here rather than only the packaging, so the tag,
    # the release and the deployment stay in one job with one ordering. macOS
    # runners are free on public repositories and a release is not a
    # latency-sensitive thing. On a private repository they bill at ten times
    # the Linux rate, which is worth knowing before anybody flips this
    # repository back to private.
    runs-on: macos-14
    # Long, because notarization is a queue at Apple rather than work this
    # runner is doing: four submissions -- an app and a disk image for each of
    # the two macOS builds -- each usually a couple of minutes and occasionally
    # far longer when Apple is busy. `notarytool --wait` has its own 45 minute
    # timeout, so this has to be comfortably above it or the job is killed
    # mid-submission and the release is left tagged with nothing attached.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to answer "has this version already gone out?", and
          # a shallow clone has none of them.
          fetch-depth: 0

      - id: version
        uses: ./.github/actions/read-version

      # Whether there is anything to do, decided before any build starts.
      #
      # Two ways there is not:
      #
      #   * No version in the tree at all. That is the state of `main` until
      #     Directory.Build.props lands, and every merge in the meantime would
      #     otherwise fail on a file that is somebody else's to add.
      #   * The tag already exists, which is the ordinary case: a merge that
      #     changed only documentation leaves the version where it was.
      #
      # Checked against the remote rather than against the local clone, because
      # the local one is a snapshot from the moment this run started and
      # another run may have tagged since.
      - name: Decide whether to publish
        id: gate
        env:
          PRESENT: ${{ steps.version.outputs.present }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if [ "$PRESENT" != 'true' ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            cat >> "$GITHUB_STEP_SUMMARY" <<'NOVERSION'
          ### Nothing released

          `Directory.Build.props` does not set a `<Version>`, so there is no
          version to tag. Add one at the repository root and the next merge
          publishes it.
          NOVERSION
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "$TAG is already tagged, so this merge publishes nothing."
            cat >> "$GITHUB_STEP_SUMMARY" <<TAGGED
          ### Nothing released

          The tag \`$TAG\` already exists, so this merge did not change the
          version and there is nothing new to publish. That is the ordinary
          outcome for a merge that only touched docs, workflows or the
          downloads site.

          To release, raise \`<Version>\` in \`Directory.Build.props\`.
          TAGGED
            exit 0
          fi

          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "$TAG does not exist yet. Publishing."

      - uses: actions/setup-dotnet@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tests ran on the pull request, but `main` can hold a combination
      # neither branch tested: two pull requests that pass separately and
      # conflict semantically once merged. Publishing that to a download page
      # is worse than a slow release.
      - name: Test
        if: steps.gate.outputs.publish == 'true'
        run: dotnet test UrDatabase.sln --configuration Release

      # A release that ships without the keys still works as an application; it
      # just shows no posters, no synopses and no ratings, which to a new user
      # is indistinguishable from the application being broken. Not made fatal
      # -- refusing to publish because a repository setting is empty turns a
      # cosmetic problem into a blocked release -- but loud, and recorded on
      # the run so the cause is obvious when the first bug report arrives.
      - name: Warn if this release would have no metadata
        if: steps.gate.outputs.publish == 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          set -euo pipefail

          MISSING=''
          if [ -z "${TMDB_API_KEY:-}" ]; then MISSING="$MISSING TMDB_API_KEY"; fi
          if [ -z "${OMDB_API_KEY:-}" ]; then MISSING="$MISSING OMDB_API_KEY"; fi

          if [ -n "$MISSING" ]; then
            echo "::warning title=Releasing without API keys::Missing repository secret(s):$MISSING. This release starts with no metadata, posters or ratings. Set them under Settings then publish a new version."
            {
              echo '> [!WARNING]'
              echo "> Built without:$MISSING. This release shows no posters,"
              echo '> synopses or ratings. Set the missing repository secrets'
              echo '> and publish a new version.'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Both API keys are available.'
          fi

      - name: Package
        id: package
        if: steps.gate.outputs.publish == 'true'
        uses: ./.github/actions/package-app
        with:
          version: ${{ steps.version.outputs.version }}
          # Compiled into the shipped binaries so an official download works
          # the moment it is opened, with no account to create and no config
          # file to write. Not secret once shipped -- see docs/releases.md --
          # but kept in Actions secrets so they are absent from git history and
          # rotating one is an edit to a repository setting rather than a
          # commit.
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          omdb-api-key: ${{ secrets.OMDB_API_KEY }}
          # The five that make the macOS download open at all. Missing, they
          # produce an ad-hoc signed build that a current Mac kills on launch
          # with no dialog -- so the steps below refuse to describe such a
          # release as signed, and say plainly that it is not. Genuinely
          # secret, unlike the two API keys above: the certificate's private
          # key and an App Store Connect key can both be used to sign software
          # as this developer.
          macos-certificate-p12-base64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          macos-certificate-password: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      # Recorded on the run before anything is published, because "is the Mac
      # build going to open?" is the question this release exists to answer and
      # a warning buried in a step log is not an answer.
      #
      # Not fatal. A repository without the certificate must still be able to
      # cut a release -- that is the state this one is in until the secrets are
      # added, and it is the state every fork is in permanently. What must not
      # happen is a release that is quietly unsigned while the notes tell
      # people it opens normally, and that is why the notes below are written
      # from these two values rather than from an assumption.
      - name: Say whether the Mac build will open
        if: steps.gate.outputs.publish == 'true'
        env:
          SIGNED: ${{ steps.package.outputs.macos-signed }}
          NOTARIZED: ${{ steps.package.outputs.macos-notarized }}
          REASON: ${{ steps.package.outputs.macos-reason }}
        run: |
          set -euo pipefail

          if [ "$NOTARIZED" = 'true' ]; then
            {
              echo '### macOS: signed and notarized'
              echo ''
              echo 'The disk images are signed with a Developer ID, notarized'
              echo "by Apple and stapled, and \`spctl\` accepted them on the"
              echo 'runner. They open by double-clicking, with no terminal'
              echo 'command.'
              echo ''
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$SIGNED" = 'true' ]; then
            HEADLINE='signed, but **not notarized**'
            EFFECT='macOS refuses an unnotarized download and says so in a dialog. Nobody can open this build without deliberately overriding Gatekeeper.'
          else
            HEADLINE='**not signed**'
            EFFECT="macOS kills an ad-hoc signed download on launch, with no dialog, no error and nothing in the interface. This build cannot be opened on a current Mac at all, and \`xattr -dr com.apple.quarantine\` does not help -- the ad-hoc signature is what is being refused, not the quarantine flag."
          fi

          echo "::warning title=The macOS download will not open::This release is $HEADLINE, because $REASON. Add the missing repository secrets and publish a new version."
          {
            echo '> [!WARNING]'
            echo "> ### The macOS download of this release is $HEADLINE"
            echo '>'
            echo "> Because $REASON."
            echo '>'
            echo "> $EFFECT"
            echo '>'
            echo "> Set \`MACOS_DEVELOPER_ID_CERT_P12_BASE64\`,"
            echo "> \`MACOS_DEVELOPER_ID_CERT_PASSWORD\`, \`APP_STORE_CONNECT_KEY_ID\`,"
            echo "> \`APP_STORE_CONNECT_ISSUER_ID\` and \`APP_STORE_CONNECT_PRIVATE_KEY\`"
            echo '> under Settings, then publish a new version. See docs/releases.md.'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      # Checksums, so somebody who cares can confirm the file they downloaded
      # is the file this run built.
      - name: Checksum the downloads
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd dist

          # nullglob so a missing `.dmg` or `.zip` disappears instead of being
          # passed through as the literal pattern, which shasum would then
          # report as a missing file and fail the release over.
          shopt -s nullglob
          FILES=(*.dmg *.zip)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo '::error title=Nothing was built::dist/ holds no .dmg and no .zip, so there is nothing to release.'
            exit 1
          fi

          # macOS ships `shasum` and no `sha256sum`; Linux is usually the other
          # way round. Both are checked so this keeps working if the job ever
          # moves back to a Linux runner, and so the output format is the same
          # either way -- it is what people paste into `shasum -c`.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- "${FILES[@]}" > SHA256SUMS.txt
          else
            shasum -a 256 -- "${FILES[@]}" > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      # Annotated rather than lightweight, so the tag itself records who
      # published it and when, independently of the commit it points at.
      #
      # Pushed before the release is created because a GitHub release needs a
      # tag to hang off. Creating the release first with `--target` would make
      # GitHub create a lightweight tag of its own, and the annotation would be
      # lost.
      - name: Tag the release
        if: steps.gate.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$TAG" --message "UrDatabase $VERSION"
          git push origin "refs/tags/$TAG"

      # Recorded so the repository's Deployments page answers "what is live and
      # when did it go out?" without anyone reading workflow logs. The ref is
      # the tag, so each entry names the version it shipped.
      #
      # Created after the tag exists: a deployment against a ref GitHub cannot
      # resolve is rejected. `required_contexts: []` matters -- the default is
      # "every status check configured on the branch", and since this workflow
      # is itself one of them, the deployment would sit forever waiting for the
      # run that is creating it.
      - name: Open a deployment
        id: deployment
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Built as JSON and piped in, rather than assembled from `--field`
          # arguments. `--field required_contexts='[]'` would send the two
          # characters `[]` as a string, the API would refuse it, and the error
          # names a type mismatch rather than the reason it matters.
          ID=$(jq -n \
                --arg ref "$TAG" \
                --arg description "UrDatabase $TAG" \
                '{
                   ref: $ref,
                   environment: "production",
                   description: $description,
                   auto_merge: false,
                   required_contexts: [],
                   production_environment: true
                 }' \
             | gh api "repos/$GITHUB_REPOSITORY/deployments" \
                 --method POST --input - --jq '.id')

          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Deployment $ID opened for $TAG."

          jq -n --arg log_url "$RUN_URL" '{state: "in_progress", log_url: $log_url}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
                --method POST --input - --silent

      # `--generate-notes` writes the "What's Changed" list from the pull
      # requests merged since the previous tag. Written by GitHub rather than
      # by this workflow because it is the only party that knows which pull
      # requests those were.
      #
      # The zips are attached here rather than uploaded afterwards so the
      # release is never briefly visible with no downloads on it -- which is
      # exactly when somebody following a link would see it.
      - name: Publish the release
        id: publish
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.package.outputs.macos-signed }}
          NOTARIZED: ${{ steps.package.outputs.macos-notarized }}
          REASON: ${{ steps.package.outputs.macos-reason }}
        run: |
          set -euo pipefail

          # One word for what packaging actually achieved, written into the
          # notes as a comment so the downloads page can read it. The page is
          # static HTML deployed independently of any release, so it cannot
          # know on its own whether the build it is offering is signed -- and a
          # page with "it is signed" baked into its markup would go on saying
          # so through a release that was not. Everything else about the macOS
          # state is human-readable a few lines below; this is the same fact in
          # a form a script can act on.
          if [ "$NOTARIZED" = 'true' ]; then
            STATE=notarized
          elif [ "$SIGNED" = 'true' ]; then
            STATE=signed
          else
            STATE=unsigned
          fi

          # An unquoted heredoc, so `$VERSION` expands, with the backticks
          # escaped so they stay Markdown instead of becoming command
          # substitution. The obvious alternative -- a quoted heredoc with a
          # placeholder replaced afterwards -- needs `sed -i`, which takes a
          # mandatory backup suffix on macOS and none on Linux, and this job
          # runs on macOS.
          cat > notes.md <<NOTES
          ## Downloads

          <!-- urdatabase:macos-signing=$STATE -->

          Take the build for your machine below, or use
          https://urdatabase-downloads.web.app

          | Machine | File |
          | --- | --- |
          | Mac, Apple silicon | \`UrDatabase-$VERSION-osx-arm64.dmg\` |
          | Mac, Intel | \`UrDatabase-$VERSION-osx-x64.dmg\` |
          | Windows, 64-bit | \`UrDatabase-$VERSION-win-x64.zip\` |

          NOTES

          # What the macOS paragraph says is decided by what actually happened
          # during packaging, never assumed. A release that claims to open
          # normally and then dies silently is the exact failure this pipeline
          # was changed to stop, and repeating it in the notes would be worse
          # than the original bug -- it would be a promise.
          if [ "$NOTARIZED" = 'true' ]; then
            cat >> notes.md <<'MACOK'
          On a Mac, open the `.dmg` and drag **UrDatabase** to Applications,
          then open it from there. The build is signed with a Developer ID and
          notarized by Apple, so it opens the first time like anything else.
          There is no terminal command to run.

          MACOK
          else
            {
              echo '> [!WARNING]'
              echo '> **The macOS downloads in this release will not open.**'
              echo ">"
              if [ "$SIGNED" = 'true' ]; then
                echo '> They are signed with a Developer ID but were not notarized,'
                echo "> because $REASON, and macOS refuses an unnotarized download."
              else
                echo '> They are only ad-hoc signed, because'
                echo "> $REASON. macOS kills an ad-hoc signed download the moment"
                echo '> it starts -- no dialog, no error, nothing in the interface.'
                echo '> Clearing the quarantine flag does not help: the signature is'
                echo '> what is being refused.'
              fi
              echo '>'
              echo '> Build from source instead, or wait for the next release.'
              echo ''
            } >> notes.md
          fi

          cat >> notes.md <<'NOTESTAIL'
          On Windows, SmartScreen shows "Windows protected your PC". Choose
          **More info**, then **Run anyway**. It is a reputation check rather
          than a signature one.

          `SHA256SUMS.txt` lists the checksum of each file.

          NOTESTAIL

          gh release create "$TAG" \
            --title "UrDatabase $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            dist/UrDatabase-"$VERSION"-osx-arm64.dmg \
            dist/UrDatabase-"$VERSION"-osx-x64.dmg \
            dist/UrDatabase-"$VERSION"-win-x64.zip \
            dist/SHA256SUMS.txt

          URL=$(gh release view "$TAG" --json url --jq '.url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          {
            echo "### Released $VERSION"
            echo ''
            echo "- $URL"
            echo '- https://urdatabase-downloads.web.app picks it up on its own,'
            echo '  because it reads the releases API in the browser rather than'
            echo '  being rebuilt.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Split from opening the deployment, and running on failure too, so the
      # Deployments page shows a failed release as failed. A deployment stuck
      # at "in progress" forever reads as "still deploying", which is the one
      # thing it is not.
      - name: Close the deployment
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ steps.deployment.outputs.id }}
          STATE: ${{ steps.publish.outcome == 'success' && 'success' || 'failure' }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # `environment_url` is left out entirely when the release never got
          # created, rather than sent empty: an empty link on the Deployments
          # page looks like a live deployment nobody can reach.
          jq -n \
            --arg state "$STATE" \
            --arg log_url "$RUN_URL" \
            --arg environment_url "${RELEASE_URL:-}" \
            --arg description "UrDatabase $VERSION" \
            '{state: $state, log_url: $log_url, description: $description}
             + (if $environment_url == "" then {}
                else {environment_url: $environment_url} end)' \
          | gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT/statuses" \
              --method POST --input - --silent

          echo "Deployment $DEPLOYMENT closed as $STATE."
