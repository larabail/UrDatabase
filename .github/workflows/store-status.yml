name: Microsoft Store status

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-status
  cancel-in-progress: false

jobs:
  status:
    name: Read Store certification status
    if: >-
      vars.STORE_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.repository == 'larabail/UrDatabase'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: microsoft-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report status without editing or committing any submission
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: python tool/store_submission.py status
