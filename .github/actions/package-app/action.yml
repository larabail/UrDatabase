name: Package UrDatabase
description: >
  Publishes UrDatabase self-contained for each runtime identifier and zips each
  one as `UrDatabase-<version>-<rid>.zip`.

# Shared between pr.yml and release.yml on purpose. The zips a reviewer
# downloads from a pull request are then byte-for-byte the same kind of thing
# as the zips attached to the release, produced by the same command. When the
# two were separate, "it worked in the PR build" and "the release is broken"
# could both be true at once.
#
# **This has to run on a macOS runner.** That is not a preference, and the
# reason is not obvious enough to be left to be rediscovered:
#
#   * On Apple silicon the kernel refuses to execute an arm64 Mach-O binary
#     that carries no code signature at all. Not a Gatekeeper prompt, not a
#     quarantine warning -- SIGKILL, reported by the shell as
#     `Killed: 9` and by Finder as nothing whatsoever. No `xattr` incantation
#     helps, because the file was never quarantined; it is simply unsignable
#     as it stands.
#   * The .NET 8 SDK ad-hoc signs the macOS apphost, which satisfies that
#     requirement -- but only when the build host is macOS. The condition in
#     Microsoft.NET.Sdk.targets is literally
#     `IsOSPlatform(OSX) and Exists('/usr/bin/codesign')`. Cross-compiling
#     `-r osx-arm64` from Linux exits 0 and produces an executable that cannot
#     start on any Apple silicon Mac.
#
# So a Linux runner would publish, package, upload and release a flagship
# download that is dead on arrival, with nothing anywhere in the logs saying
# so. The `codesign --verify` below exists to make sure that can never be true
# again quietly.
#
# A macOS host is also the one that gets the archive permissions right: the
# executable bit lives in a zip's external attributes, and a zip built on
# Windows has no bit to record, so the download would need `chmod +x` before it
# could start.
#
# Windows is published from here too. It needs no signature to run and no
# executable bit, so there is nothing to gain from a second runner.
#
# Neither ReadyToRun nor NativeAOT is enabled anywhere below. Both need a host
# matching the target, which would mean three runners instead of one.

inputs:
  version:
    description: The version to build and to name the archives after.
    required: true
  tmdb-api-key:
    description: >
      The TMDB key to compile in. Empty produces a build with no live metadata,
      which is the correct outcome for a pull request from a fork -- GitHub
      does not hand secrets to those, and a build failing because of it would
      make outside contributions impossible for no security gain.
    required: false
    default: ''
  omdb-api-key:
    description: >
      The OMDb key to compile in, for IMDb ratings. Empty for the same reasons
      as above.
    required: false
    default: ''
  runtimes:
    description: Space-separated runtime identifiers.
    required: false
    default: osx-arm64 osx-x64 win-x64
  project:
    description: The application project to publish.
    required: false
    default: src/UrDatabase.App/UrDatabase.App.csproj
  output:
    description: Where the finished zips are written.
    required: false
    default: dist

outputs:
  directory:
    description: The directory holding the finished zips.
    value: ${{ inputs.output }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RUNTIMES: ${{ inputs.runtimes }}
        PROJECT: ${{ inputs.project }}
        OUTPUT: ${{ inputs.output }}
        TMDB_API_KEY: ${{ inputs.tmdb-api-key }}
        OMDB_API_KEY: ${{ inputs.omdb-api-key }}
      run: |
        set -euo pipefail

        mkdir -p "$OUTPUT"

        # Said once, up front, rather than left for somebody to work out from a
        # running application that shows no posters. A build with no keys is a
        # legitimate build -- it is what a fork gets -- it is just not one to
        # hand to a user.
        if [ -z "$TMDB_API_KEY" ] || [ -z "$OMDB_API_KEY" ]; then
          echo '::notice title=Built without API keys::TMDB_API_KEY or OMDB_API_KEY was not available to this run, so these builds start with no metadata, posters or ratings. Expected for a pull request from a fork.'
        fi

        # Split into an array rather than looped over unquoted, so the loop
        # says out loud that word splitting is the intent here and nowhere
        # else in this script.
        read -ra RIDS <<< "$RUNTIMES"

        for RID in "${RIDS[@]}"; do
          NAME="UrDatabase-${VERSION}-${RID}"
          echo "::group::Publishing $NAME"

          # Staged under its own name so the archive holds exactly one
          # top-level folder called `UrDatabase-<version>-<rid>`. Every unzip
          # tool then produces the same path, which is what makes it possible
          # to print a `xattr -dr com.apple.quarantine ~/Downloads/<that>`
          # command on the downloads page that is actually correct -- and it
          # stops a double-click in ~/Downloads emptying two hundred runtime
          # files into it.
          rm -rf "stage/$NAME"

          # -p:Version is passed as well as being set in Directory.Build.props
          # so the assembly and the filename cannot disagree, including on a
          # branch where the props file does not exist yet.
          #
          # The two API keys are compiled in so that an official build works
          # the moment it is opened, with no signing up and no configuration
          # file to write. They are passed as MSBuild properties rather than
          # left in the repository, which keeps them out of git history and
          # makes rotating one a change to a repository secret instead of a
          # commit. Note what this is *not*: the values end up inside the
          # shipped binaries and anybody can read them back out of a download.
          # See docs/releases.md.
          #
          # Both are quoted, so an empty one expands to `-p:TmdbApiKey=` --
          # a property explicitly set to nothing, which is exactly what a fork
          # should build with -- rather than dropping the argument and letting
          # a stale default apply.
          #
          # ContinuousIntegrationBuild normalises the paths baked into the
          # binaries, so two runs of the same commit produce the same output.
          dotnet publish "$PROJECT" \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            --nologo \
            -p:Version="$VERSION" \
            -p:TmdbApiKey="$TMDB_API_KEY" \
            -p:OmdbApiKey="$OMDB_API_KEY" \
            -p:ContinuousIntegrationBuild=true \
            --output "stage/$NAME"

          echo "::endgroup::"

          # A publish that produces no launcher still exits 0 -- it happens
          # when the project is a library, or when the target framework is
          # still windows-only and the RID cannot satisfy it. Caught here, the
          # message names the likely cause; left alone, it surfaces as a
          # release whose zips nobody can start.
          APP=$(basename "$PROJECT" .csproj)
          if [ ! -f "stage/$NAME/$APP" ] && [ ! -f "stage/$NAME/$APP.exe" ]; then
            echo "::error title=Nothing to run::Publishing $RID produced no $APP executable. Check that ${PROJECT} sets OutputType to WinExe or Exe, targets net8.0 rather than a windows-only framework, and still builds an assembly called ${APP}."
            ls -la "stage/$NAME" | head -n 40
            exit 1
          fi

          # And for the two macOS builds, that the launcher is signed.
          #
          # An unsigned arm64 binary is killed by the kernel the moment it
          # starts, so shipping one means a download that does nothing at all.
          # The SDK signs it automatically on a macOS host and silently does
          # not anywhere else, which makes this exactly the kind of failure
          # that survives review: the build is green, the zip is the right
          # size, and only somebody who unzips it on an actual Mac finds out.
          case "$RID" in
            osx-*)
              if ! codesign --verify --verbose=1 "stage/$NAME/$APP" 2>&1; then
                echo "::error title=Unsigned macOS build::stage/$NAME/$APP has no valid code signature, so macOS will kill it on launch. The .NET SDK only ad-hoc signs the apphost when the build host is macOS -- check that this job still runs on a macOS runner."
                exit 1
              fi
              ;;
          esac

          # Zipped from inside `stage/` so the paths in the archive start at
          # the folder name and not at `stage/`.
          ( cd stage && zip --recurse-paths --quiet "../${OUTPUT}/${NAME}.zip" "$NAME" )
          echo "Packaged ${OUTPUT}/${NAME}.zip"
        done

        echo 'Built:'
        ls -lh "$OUTPUT"
