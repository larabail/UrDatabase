name: Package UrDatabase
description: >
  Publishes UrDatabase self-contained for each runtime identifier: the macOS
  builds as a signed, notarized `UrDatabase-<version>-<rid>.dmg`, and Windows
  as `UrDatabase-<version>-win-x64.zip`.

# Shared between pr.yml and release.yml on purpose. The artefacts a reviewer
# downloads from a pull request are then the same kind of thing as the ones
# attached to the release, produced by the same commands. When the two were
# separate, "it worked in the PR build" and "the release is broken" could both
# be true at once.
#
# **This has to run on a macOS runner.** That is not a preference, and the
# reason is not obvious enough to be left to be rediscovered:
#
#   * On Apple silicon the kernel refuses to execute an arm64 Mach-O binary
#     that carries no code signature at all. Not a Gatekeeper prompt, not a
#     quarantine warning -- SIGKILL, reported by the shell as `Killed: 9` and
#     by Finder as nothing whatsoever.
#   * The .NET 8 SDK ad-hoc signs the macOS apphost, which satisfies that much
#     -- but only when the build host is macOS. The condition in
#     Microsoft.NET.Sdk.targets is literally
#     `IsOSPlatform(OSX) and Exists('/usr/bin/codesign')`. Cross-compiling
#     `-r osx-arm64` from Linux exits 0 and produces an executable that cannot
#     start on any Apple silicon Mac.
#   * Everything below the publish -- codesign, hdiutil, notarytool, stapler,
#     spctl -- is macOS-only anyway.
#
# A macOS host is also the one that gets the archive permissions right for the
# Windows zip: the executable bit lives in a zip's external attributes, and a
# zip built on Windows has no bit to record.
#
# Windows is published from here too. It needs no signature to run and no
# executable bit, so there is nothing to gain from a second runner.
#
# Neither ReadyToRun nor NativeAOT is enabled anywhere below. Both need a host
# matching the target, which would mean three runners instead of one.

inputs:
  version:
    description: The version to build and to name the artefacts after.
    required: true
  tmdb-api-key:
    description: >
      The TMDB key to compile in. Empty produces a build with no live metadata,
      which is the correct outcome for a pull request from a fork -- GitHub
      does not hand secrets to those, and a build failing because of it would
      make outside contributions impossible for no security gain.
    required: false
    default: ''
  omdb-api-key:
    description: >
      The OMDb key to compile in, for IMDb ratings. Empty for the same reasons
      as above.
    required: false
    default: ''
  uractor-api-key:
    description: >
      The UrActor key to compile in, for the Academy Award nominations under
      the poster. Empty for the same reasons as above, and unlike the two keys
      above an empty one is barely noticeable -- most films were never
      nominated for anything, so the panel is already hidden on nearly every
      film in a library.
    required: false
    default: ''
  macos-certificate-p12-base64:
    description: >
      The `Developer ID Application` certificate and its private key, as a
      base64 `.p12`. Empty means the macOS builds are only ad-hoc signed, which
      a current Mac kills on launch -- so it is reported loudly rather than
      left to look like a normal build.
    required: false
    default: ''
  macos-certificate-password:
    description: The password for that `.p12`.
    required: false
    default: ''
  app-store-connect-key-id:
    description: >
      App Store Connect API key id, used to notarize. Empty means the build is
      signed but not notarized, which macOS still refuses -- with a dialog
      rather than in silence.
    required: false
    default: ''
  app-store-connect-issuer-id:
    description: App Store Connect issuer id.
    required: false
    default: ''
  app-store-connect-private-key:
    description: The `.p8` private key, in full.
    required: false
    default: ''
  runtimes:
    description: Space-separated runtime identifiers.
    required: false
    default: osx-arm64 osx-x64 win-x64
  project:
    description: The application project to publish.
    required: false
    default: src/UrDatabase.App/UrDatabase.App.csproj
  icon:
    description: The `.icns` that becomes the macOS bundle's icon.
    required: false
    default: src/UrDatabase.App/Assets/UrDatabase.icns
  output:
    description: Where the finished artefacts are written.
    required: false
    default: dist

outputs:
  directory:
    description: The directory holding the finished artefacts.
    value: ${{ inputs.output }}
  macos-signed:
    description: >
      `true` when the macOS builds carry a Developer ID signature. Both macOS
      runtime identifiers go through identical code, so one answer covers both.
    value: ${{ steps.package.outputs.signed }}
  macos-notarized:
    description: '`true` when the macOS builds were notarized and stapled.'
    value: ${{ steps.package.outputs.notarized }}
  macos-reason:
    description: Why the macOS builds are not signed or notarized, when they are not.
    value: ${{ steps.package.outputs.reason }}

runs:
  using: composite
  steps:
    - id: package
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RUNTIMES: ${{ inputs.runtimes }}
        PROJECT: ${{ inputs.project }}
        ICON: ${{ inputs.icon }}
        OUTPUT: ${{ inputs.output }}
        TMDB_API_KEY: ${{ inputs.tmdb-api-key }}
        OMDB_API_KEY: ${{ inputs.omdb-api-key }}
        URACTOR_API_KEY: ${{ inputs.uractor-api-key }}
        MACOS_CERT_P12_BASE64: ${{ inputs.macos-certificate-p12-base64 }}
        MACOS_CERT_PASSWORD: ${{ inputs.macos-certificate-password }}
        ASC_KEY_ID: ${{ inputs.app-store-connect-key-id }}
        ASC_ISSUER_ID: ${{ inputs.app-store-connect-issuer-id }}
        ASC_PRIVATE_KEY: ${{ inputs.app-store-connect-private-key }}
      run: |
        set -euo pipefail

        cd "$GITHUB_WORKSPACE"
        mkdir -p "$OUTPUT"

        # Seeded before anything runs, so a caller reading these outputs always
        # gets an answer -- including when `runtimes` names no macOS build at
        # all and nothing below ever sets them. The packaging script appends
        # its own values later, and for these the last write wins.
        {
          echo 'signed=false'
          echo 'notarized=false'
          echo 'reason=no macOS build was produced by this run'
        } >> "$GITHUB_OUTPUT"

        # Said once, up front, rather than left for somebody to work out from a
        # running application that shows no posters. A build with no keys is a
        # legitimate build -- it is what a fork gets -- it is just not one to
        # hand to a user.
        if [ -z "$TMDB_API_KEY" ] || [ -z "$OMDB_API_KEY" ]; then
          echo '::notice title=Built without API keys::TMDB_API_KEY or OMDB_API_KEY was not available to this run, so these builds start with no metadata, posters or ratings. Expected for a pull request from a fork.'
        fi

        # Split into an array rather than looped over unquoted, so the loop
        # says out loud that word splitting is the intent here and nowhere
        # else in this script.
        read -ra RIDS <<< "$RUNTIMES"

        APP=$(basename "$PROJECT" .csproj)

        for RID in "${RIDS[@]}"; do
          NAME="UrDatabase-${VERSION}-${RID}"
          PUBLISH="stage/publish-${RID}"
          echo "::group::Publishing $NAME"

          rm -rf "$PUBLISH"

          # -p:Version is passed as well as being set in Directory.Build.props
          # so the assembly, the bundle's CFBundleVersion and the filename
          # cannot disagree, including on a branch where the props file does
          # not exist yet.
          #
          # The three API keys are compiled in so that an official build works
          # the moment it is opened, with no signing up and no configuration
          # file to write. They are passed as MSBuild properties rather than
          # left in the repository, which keeps them out of git history and
          # makes rotating one a change to a repository secret instead of a
          # commit. Note what this is *not*: the values end up inside the
          # shipped binaries and anybody can read them back out of a download.
          # See docs/releases.md.
          #
          # All are quoted, so an empty one expands to `-p:TmdbApiKey=` --
          # a property explicitly set to nothing, which is exactly what a fork
          # should build with -- rather than dropping the argument and letting
          # a stale default apply.
          #
          # ContinuousIntegrationBuild normalises the paths baked into the
          # binaries, so two runs of the same commit produce the same output.
          dotnet publish "$PROJECT" \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            --nologo \
            -p:Version="$VERSION" \
            -p:TmdbApiKey="$TMDB_API_KEY" \
            -p:OmdbApiKey="$OMDB_API_KEY" \
            -p:UrActorApiKey="$URACTOR_API_KEY" \
            -p:ContinuousIntegrationBuild=true \
            --output "$PUBLISH"

          echo "::endgroup::"

          # A publish that produces no launcher still exits 0 -- it happens
          # when the project is a library, or when the target framework is
          # still windows-only and the RID cannot satisfy it. Caught here, the
          # message names the likely cause; left alone, it surfaces as a
          # release whose downloads nobody can start.
          if [ ! -f "$PUBLISH/$APP" ] && [ ! -f "$PUBLISH/$APP.exe" ]; then
            echo "::error title=Nothing to run::Publishing $RID produced no $APP executable. Check that ${PROJECT} sets OutputType to WinExe or Exe, targets net8.0 rather than a windows-only framework, and still builds an assembly called ${APP}."
            ls -la "$PUBLISH" | head -n 40
            exit 1
          fi

          case "$RID" in
            osx-*)
              # That the SDK signed the launcher at all, checked before
              # anything is built on top of it. The SDK ad-hoc signs the
              # apphost on a macOS host and silently does not anywhere else,
              # which makes this exactly the kind of failure that survives
              # review: the build is green, the artefact is the right size, and
              # only somebody who runs it on an actual Mac finds out. It is
              # also the cheapest possible check that this job is still on a
              # macOS runner.
              if ! codesign --verify --verbose=1 "$PUBLISH/$APP" 2>&1; then
                echo "::error title=Unsigned macOS build::$PUBLISH/$APP has no code signature at all, so nothing below can re-sign it into something that runs. The .NET SDK only ad-hoc signs the apphost when the build host is macOS -- check that this job still runs on a macOS runner."
                exit 1
              fi

              # Notarization staples a ticket to a bundle or a disk image and
              # has nowhere to put one on a loose executable, so the .app is a
              # prerequisite for the rest of this rather than a nicety. The
              # publish directory is moved into the bundle, not copied.
              rm -rf "stage/$RID"
              python3 tool/make_macos_bundle.py \
                --publish-dir "$PUBLISH" \
                --output "stage/$RID" \
                --version "$VERSION" \
                --icon "$ICON"

              # Signs, notarizes, staples and wraps the bundle in a disk image.
              # Degrades to an unsigned .dmg with a loud warning when the
              # secrets are absent, which is what a fork gets; see the script
              # for why the container is a disk image rather than a zip.
              scripts/package-macos-app.sh \
                "stage/$RID/UrDatabase.app" \
                "${OUTPUT}/${NAME}.dmg"

              echo "Packaged ${OUTPUT}/${NAME}.dmg"
              ;;

            *)
              # Windows keeps its zip. It needs no signature to start and no
              # executable bit, and the archive holds exactly one top-level
              # folder called `UrDatabase-<version>-win-x64`, so every unzip
              # tool produces the same path and a double-click in ~/Downloads
              # does not empty two hundred runtime files into it.
              rm -rf "stage/$NAME"
              mv "$PUBLISH" "stage/$NAME"
              ( cd stage && zip --recurse-paths --quiet "../${OUTPUT}/${NAME}.zip" "$NAME" )
              echo "Packaged ${OUTPUT}/${NAME}.zip"
              ;;
          esac
        done

        echo 'Built:'
        ls -lh "$OUTPUT"
