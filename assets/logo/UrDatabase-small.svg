<?xml version="1.0" encoding="UTF-8"?>
<!--
  UrDatabase app icon, small master: the 16, 24 and 32px frames, and the
  downloads site's favicon.

  The same clapperboard as UrDatabase.svg, redrawn on a 32-unit grid rather
  than scaled down from it, because scaled down the stripes, rules and tile
  margin all fall between pixels and blur to a grey square. Here the tile runs
  to the edge, there are three bars per stick instead of four, one ink rule
  instead of two, and every straight edge lands on an even unit, which is a
    whole pixel at 16px as well as at 32.

  Edit this file, then run `python tool/make_icons.py`. If you change it, copy
  the result into the favicon data URI in web/downloads/index.html too.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <clipPath id="stick">
      <rect x="0" y="0" width="24" height="4" rx="1"/>
    </clipPath>
    <g id="stripes" clip-path="url(#stick)">
      <rect x="0" y="0" width="24" height="4" fill="#F1ECE3"/>
      <path fill="#1B1816" d="M2 4 L6 0 L10 0 L6 4 Z
                              M10 4 L14 0 L18 0 L14 4 Z
                              M18 4 L22 0 L26 0 L22 4 Z"/>
    </g>
  </defs>

  <rect x="0" y="0" width="32" height="32" rx="7" fill="#1E1B18"/>

  <rect x="4" y="16" width="24" height="12" rx="1" fill="#F1ECE3"/>
  <use href="#stripes" transform="translate(4 10)"/>
  <use href="#stripes" transform="rotate(-13 4 9) translate(4 4)"/>

  <rect x="8" y="18" width="16" height="2" fill="#A83A24"/>
  <rect x="8" y="22" width="10" height="2" fill="#1B1816"/>
</svg>
